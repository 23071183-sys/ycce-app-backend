services:
  - type: web
    name: ycce-app-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BACKEND_URL
        value: https://ycce-app-backend.onrender.com
      - key: CAMPUS_LAT
        value: "21.094478"
      - key: CAMPUS_LNG
        value: "78.977594"
      - key: CAMPUS_RADIUS_M
        value: "400"
      - key: GEMINI_API_KEY
        sync: false
