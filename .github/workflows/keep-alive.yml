# Render's free plan puts the service to sleep after 15 minutes without traffic.
# Pinging it every 10 minutes keeps it awake (about 720 h/month, under the 750 h free limit).
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://ycce-app-backend.onrender.com/; then
              echo; echo "Backend is awake"; exit 0
            fi
            echo "Attempt $i failed, retrying in 20s"; sleep 20
          done
          echo "Backend did not respond"; exit 1
